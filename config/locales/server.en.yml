en:
  site_settings:
    # NOTE: core renders `site_settings.<name>` as the setting's DESCRIPTION;
    # the label is derived from the setting name and is not translatable.
    # There is no `<name>_description` key — core never reads one.
    # Tab/category names live in client.en.yml under
    # admin_js.admin.site_settings.categories.

    # ── Jtech (master) ─────────────────────────────────────────────────────
    jtech_enabled: Master gate for the whole Jtech plugin bundle. Every
      sub-plugin also has its own enable switch on its tab for fine-grained
      control.

    # ── Jtech — Dislike ────────────────────────────────────────────────────
    discourse_no_likes_enabled: Turn on phantom reactions. When off, likes and
      reactions behave exactly as Discourse ships them in every category and
      none of the settings below have any effect.

    no_reactions_category_ids: Categories in which likes and reactions are
      treated as "phantom". Nothing happens until at least one category is
      selected. Subcategories are not included automatically — add each one
      explicitly.

    dislike_hide_like_button: Hide the like and reaction buttons in these
      categories, and reject like requests that reach the API anyway. Existing
      likes are left in place. This overrides
      {{setting:dislike_allowed_like_groups}} — while it is on, nobody can
      like, whatever that list says.

    dislike_allowed_like_groups: Restrict liking in these categories to members
      of these groups; everyone else gets no like button. Leave empty to allow
      every logged-in user — unlike most group settings, empty means
      "everyone", not "nobody". Anonymous likes are not filtered by this list.

    dislike_show_in_history: Keep phantom likes in the activity streams — the
      liker's "Likes Given" and the author's "Likes Received". When off the
      like is invisible in both streams and the author's "liked" notification
      is deleted as well; see
      {{setting:dislike_notification_cleanup_window_seconds}}.

    dislike_notification_cleanup_window_seconds: How far back to look for the
      author's "liked" notification when deleting it. The delete runs inline
      the instant the like is created, so the default covers a healthy site;
      raise it only if notifications survive, and be aware that a longer
      window can also remove an older "liked" notification for the same post
      from a different user. Consolidated "liked" notifications are never
      removed. Only used while {{setting:dislike_show_in_history}} is off.

    dislike_count_in_leaderboard: Let phantom likes move the likes_given and
      likes_received user statistics. These feed the leaderboard, user cards,
      the user directory sort and like-based badges — not just the
      leaderboard. When off the counters are left untouched, and
      {{setting:purge_phantom_likes_now}} recalculates them from
      non-restricted categories only.

    dislike_record_audit_trail: Write one row per phantom reaction to the
      discourse_no_likes_phantoms table — likes, plus any non-default
      discourse-reactions emoji. There is no admin screen for this table;
      query it with the Data Explorer. Turn off to skip an extra insert on
      every like in these categories.

    purge_phantom_likes_now: Run the retroactive clean-up job now; it switches
      itself back off when it starts (reload the page to see that). The job
      back-fills the audit table from likes that already exist, recalculates
      likes_given and likes_received for affected users unless
      {{setting:dislike_count_in_leaderboard}} is on, and deletes the matching
      activity-stream rows unless {{setting:dislike_show_in_history}} is on.
      It does not delete any likes and does not touch notifications.

    # ── Jtech — Alternate SMTP ─────────────────────────────────────────────
    discourse_another_email_enabled: Send outbound forum email through the
      relay configured below instead of the server's DISCOURSE_SMTP_* host.
      Only the host, port, transport security and credentials are replaced —
      everything else in the mail configuration still applies. This affects
      every outgoing message, including mail sent from group SMTP addresses,
      which will no longer use their own per-group credentials.

    discourse_another_email_smtp_address: Hostname or IP address of the
      relay — no scheme, port, or path. Leave empty to keep using the
      server's configured SMTP host; the rest of this tab is then ignored.

    discourse_another_email_smtp_port: 587 for STARTTLS submission, 465 for
      implicit TLS, 25 for an unauthenticated relay on a private network.
      Must agree with the transport security setting below.

    discourse_another_email_smtp_security: How the connection to the relay is
      encrypted. STARTTLS (opportunistic) upgrades only if the relay offers
      it and sends in the clear otherwise; STARTTLS (required) fails the
      delivery instead. Use Implicit TLS for port 465, and None only on a
      trusted private network.

    discourse_another_email_smtp_openssl_verify_mode: Set to "Do not verify"
      only if the relay presents a self-signed certificate, or one whose name
      does not match the relay host above. Doing so removes protection
      against interception of your outbound mail.

    discourse_another_email_smtp_authentication_mode: SMTP AUTH mechanism used
      with the credentials below. PLAIN and LOGIN both send the password in
      readable form, so pair them with TLS. Choose None for a relay that
      accepts mail without authenticating.

    discourse_another_email_smtp_username: SMTP AUTH user. Often a full
      mailbox address, but some providers expect a fixed token instead
      (SendGrid uses the literal "apikey"). Ignored while
      {{setting:discourse_another_email_force_smtp_username_to_sender}} is
      on.

    discourse_another_email_smtp_password: SMTP AUTH password or API key.
      Hidden in this form and filtered from staff action logs once saved, so
      verify it before saving — you will not be able to read it back.

    discourse_another_email_force_from_domain: Replaces the domain of every
      outgoing From address with this one, keeping the local part
      (noreply@forum.example becomes noreply@example.com). Set it when the
      relay only accepts mail from its own domain. Leave empty to send From
      addresses unchanged. Only applies while the alternate relay is enabled.

    discourse_another_email_force_smtp_username_to_sender: Logs in to the
      relay separately for each message, as that message's own From address
      with any +tag suffix removed, and after the domain rewrite above has
      been applied. This replaces the relay username entirely. Turn it on
      only for relays that require the AUTH user to match the sender, and
      only if the relay password is valid for every address the forum sends
      from.

    discourse_another_email_smtp_domain: Domain this forum announces in the
      SMTP HELO/EHLO greeting. Leave empty to keep the server's global HELO
      domain. Set it when the relay rejects mail whose HELO name does not
      resolve back to it.

    discourse_another_email_smtp_open_timeout_seconds: Seconds to wait for the
      connection to the relay to open before abandoning the delivery.

    discourse_another_email_smtp_read_timeout_seconds: Seconds to wait for
      each reply from the relay before abandoning the delivery.

    # ── Jtech — Mini-mod ───────────────────────────────────────────────────
    mini_mod_enabled: Master switch for Mini-mod. Everything on this tab
      applies only to category group moderators — users who moderate a
      category through a category moderation group, set up with
      {{setting:enable_category_group_moderation}}. It never applies to
      site-wide moderators (those are on the Jtech — Mod tab) and never
      changes anything for staff. While this is off, every setting below has
      no effect.

    mini_mod_manage_all_categories: Scope for the grants below. Off, a
      category group moderator's Mini-mod rights reach only the categories
      they actually moderate. On, they reach every category on the site, they
      may create top-level categories, and "Mini mod can edit topics" starts
      taking effect — that setting does nothing while this one is off. Turn
      this on deliberately; it is the widest switch on this tab.

    mini_mod_can_create_categories: Let category group moderators create
      categories. With "Mini mod manage all categories" off they may only
      create subcategories beneath a category they already moderate; with it
      on they may create any category, top-level included. Deleting
      categories is never granted.

    mini_mod_can_edit_categories: Let category group moderators open the
      category settings screens and save changes, for the categories they
      moderate — or for every category when "Mini mod manage all categories"
      is on.

    mini_mod_can_edit_topics: Let category group moderators edit any topic
      they can see — title, category, tags and first post — unless the first
      post is locked. This is site-wide and is not limited to the categories
      they moderate. It requires "Mini mod manage all categories"; while that
      is off, this setting does nothing.

    mini_mod_can_move_topics: Let category group moderators move topics into
      another category. Destinations are limited to the categories they
      moderate, or to any category they can see when "Mini mod manage all
      categories" is on.

    mini_mod_manage_tags: Let category group moderators create tags, rename
      tags and reach the tag administration screens, as staff can. This is
      site-wide and is not limited to the categories they moderate. Tag
      groups stay staff-only. Requires {{setting:tagging_enabled}}.

    mini_mod_can_post_in_closed_topics: A restriction, not a grant. Discourse
      normally lets category group moderators reply inside closed topics in
      the categories they moderate; leaving this off takes that away. Turn it
      on to restore the standard behaviour. Staff are never affected.

    mini_mod_can_reopen_topics: A restriction, not a grant. Discourse normally
      lets category group moderators reopen closed topics in the categories
      they moderate; leaving this off takes that away and hides the reopen
      button on closed topics, rather than letting them click it and hit an
      error. Turn it on to restore the standard behaviour. Staff are never
      affected.

    tl4_can_post_in_closed_topics: A restriction, not a grant, and it reaches
      every trust level 4 user on the site — not only category group
      moderators. Discourse normally lets TL4 users reply inside closed
      topics; leaving this off takes that away. It is enforced by this
      module, so it only has any effect while {{setting:mini_mod_enabled}} is
      on. Staff are never affected.

    tl4_can_reopen_topics: A restriction, not a grant, and it reaches every
      trust level 4 user on the site — not only category group moderators.
      Discourse normally lets TL4 users reopen closed topics; leaving this
      off takes that away and hides the reopen button on closed topics. It is
      enforced by this module, so it only has any effect while
      {{setting:mini_mod_enabled}} is on. Staff are never affected.

    # ── Jtech — Mod ────────────────────────────────────────────────────────
    mod_categories_enabled: Master switch for the moderator powers in this
      module — category grants, topic tools, checklists, private staff notes
      and staff event notifications. Off means moderators lose every grant
      below, immediately. Whispers, the notification type filter and
      notification auto-mark have their own switches and keep working with
      this off.

    mod_moderators_can_create_categories: Grants every moderator category
      creation, which Discourse core reserves for admins. Applies site-wide;
      there is no per-category or per-moderator scoping.

    mod_moderators_can_edit_categories: Grants every moderator edit rights on
      every category, site-wide — INCLUDING its security settings, so a
      moderator can grant themselves or anyone else access to a private
      category. Leave off unless you trust all moderators with that.

    mod_moderators_can_delete_categories: Grants every moderator deletion of
      categories that are empty (no topics), have no subcategories, and are
      not Uncategorized. Categories with content cannot be deleted through
      this grant.

    # ── Jtech — Mod: Topic tools ───────────────────────────────────────────
    precheck_new_topic_enabled: Shows a "before you post" prompt when a user
      starts a topic in a category that has one set. Moderators write the
      prompt, and its trust-level cap, in the category's settings.

    topic_footer_message_enabled: Lets moderators pin a message below the last
      reply of a topic. The footer is PUBLIC — every user who can read the
      topic sees it. For staff-only text, use private staff notes instead.

    mod_pin_post_enabled: Lets moderators pin any post in a topic to the
      bottom of that topic. The pinned copy and its in-stream badge are
      visible to every reader.

    mod_topic_require_reply_approval_enabled: Lets moderators flag individual
      topics so every reply goes to the review queue first. Staff and anyone
      who can review the topic post normally. Turning this OFF stops the
      queuing but does not clear the flags — re-enabling it resumes queuing
      on the same topics.

    mod_pm_badge_group_enabled: Lets staff composing a personal message expand
      a badge into its current holders as recipients. Every holder becomes a
      named participant of the PM and can see the others. The holder lookup
      is staff-only, so ordinary users cannot use it to enumerate badge
      membership.

    # ── Jtech — Mod: Checklists ────────────────────────────────────────────
    mod_first_post_checklist_enabled: Lets moderators maintain a checklist
      that users must accept before they can post, up to a trust-level cap
      set in the checklist itself (TL2 by default). Staff are exempt.
      Includes the acceptance audit log and forced re-acceptance.

    mod_targeted_checklists_enabled: Lets moderators aim a checklist at named
      users, blocking their posting anywhere on the forum until they accept —
      regardless of trust level, and including other moderators. Admins can
      never be targeted.

    mod_topic_prompt_checklist_enabled: Lets moderators attach a blocking
      checklist or single statement to one topic, shown before posting in it.
      Applies to everyone including staff, and can be set to re-prompt on
      every reply rather than once per user.

    topic_reply_prompt_enabled: Legacy — replaced by per-topic prompt
      checklists. Nothing writes new reply prompts; this only keeps showing
      prompts saved before the migration, and each topic's prompt is cleared
      the first time a moderator saves a prompt checklist for it. Turn off
      once no topic still relies on an old prompt.

    # ── Jtech — Mod: Notes ─────────────────────────────────────────────────
    mod_topic_private_notes_enabled: Lets staff attach a private note, with a
      reply thread, to any topic. Notes are serialized to staff only and
      never reach a regular user's topic JSON.

    mod_moderators_can_edit_others_notes: When on, any moderator may edit or
      delete notes and note replies written by other staff. Notes keep no
      revision history, so such a change is silent and cannot be recovered —
      leave off unless you need it. Authors can always edit their own notes;
      admins can always edit any note.

    mod_note_view_tracking_enabled: Records each staff member's name and the
      time they opened a topic's note panel, and shows the list ("Viewed by
      N") to all staff on that topic.

    mod_notes_feed_enabled: The staff user-menu shield tab — a cross-forum
      feed of noted topics and staff events, with its unread counter kept in
      sync with the notification bell.

    # ── Jtech — Mod: Notifications ─────────────────────────────────────────
    mod_notify_staff_on_topic_notes: Sends every other admin and moderator a
      bell notification and live alert when a staff member writes or replies
      to a topic note. The notification carries the first 300 characters of
      the note.

    mod_notify_staff_on_post_actions: Notifies every other staff member when a
      moderator deletes a post or rejects a queued post. Self-deletes and
      system actions are skipped. Approvals are separate — see
      {{setting:mod_notify_staff_on_post_approved}}.

    mod_notify_staff_on_post_approved: Notifies every other staff member when
      a moderator approves a queued post. Off by default — approvals are
      routine and noisy.

    mod_notify_staff_on_user_notes: Notifies every other staff member when a
      moderator adds a note to a user's profile. Requires the
      discourse-user-notes plugin; does nothing without it.

    mod_notify_staff_on_flag_notes: Notifies every other staff member when a
      moderator adds a note to a flag or other reviewable in the review
      queue. Requires a Discourse version with reviewable notes.

    mod_notify_whisper_targets: Sends a bell notification to a whisper's
      audience when one is posted, and to a user when staff add them to a
      topic's whisper conversation. Off means whispers still work but arrive
      silently.

    mod_auto_mark_notifications_seen: Opening a topic, or the review queue,
      marks THIS plugin's own note and whisper notifications for it as read.
      Core notifications and other plugins' notifications are untouched.
      Independent of the Enable Mod master switch.

    mod_notification_type_filter_enabled: Adds a type filter to the user
      notifications page, plus a staff-only mod-notes stream. While a filter
      is active the plugin renders that page's results itself instead of
      Discourse — turn this off first when troubleshooting the notifications
      page. Independent of the Enable Mod master switch.

    # ── Jtech — Mod: Whispers ──────────────────────────────────────────────
    mod_whisper_enabled: Master switch for whispers — independent of Enable
      Mod, so whispers keep working when the rest of the module is off. Staff
      post in-topic messages visible only to staff, the author, the topic's
      whisper participants and any explicit targets. WARNING — turning this
      OFF does not delete existing whispers; it makes every one of them
      visible to anyone who can read the topic, and re-indexes them for
      search.

    mod_whisper_add_participant_enabled: Lets staff add a user to a topic's
      whisper conversation. The user is notified and can then read every
      whisper in that topic, including ones written before they were added.

    mod_whisper_convert_enabled: Lets staff turn an existing post into a
      whisper and back, and retarget its audience. Converting to public
      re-indexes the post so it becomes searchable again; converting to a
      whisper removes it from the search index.

    mod_whisper_badge_targeting_enabled: Lets staff target whispers at badge
      holders as well as users and groups. Membership is checked when the
      whisper is read, so a user who later earns the badge can read earlier
      whispers, and one who loses it loses access.

    mod_whisper_audience_aware_topic_list: Keeps a whisper from bumping a
      topic up the latest list, or refreshing its activity time, for users
      who cannot read it. Costs two extra joins on every topic list query —
      turn off to fall back to normal ordering, where a whisper bumps the
      topic for everyone.

    # ── Jtech — Translator tweaks ──────────────────────────────────────────
    translator_tweaks_enabled: Master switch for the Jtech tweaks to the
      upstream discourse-translator plugin. Everything in this section is
      inert unless that plugin is installed. The globe tweak below responds
      to this switch immediately; the worker proxy is applied once at boot,
      so turning this off does not send translation traffic back to Google
      until the site is restarted.

    translator_tweaks_worker_url: 'Base URL the bundled Google translate
      provider is pointed at instead of translation.googleapis.com — include
      the full /language/translate/v2 path; /detect and /languages are
      appended to it. Leave blank to let discourse-translator call Google
      directly. Two caveats: every post being translated or
      language-detected is sent to this host, so only enter a proxy you
      control; and the endpoints are Ruby constants swapped at boot, so
      editing or clearing this has no effect until a full app restart
      (./launcher restart app).'

    translator_tweaks_hide_untranslatable: Hide the translate globe on posts
      that have no detected language yet, instead of showing a globe whose
      click is a no-op. Posts written before discourse-translator was
      installed never get a detection row unless they are backfilled;
      brand-new posts get the globe a few seconds later when the detection
      job lands. Takes effect immediately — no restart needed.

    # ── Jtech — Smart search ─────────────────────────────────────────────
    smart_search_enabled: When a search returns few results, run it again
      with synonyms substituted and merge the extra hits in, so that "js"
      also finds posts that only say "javascript" and "k8s" finds
      "kubernetes". Synonyms come from a bundled English lexical database
      (WordNet) plus a tech-jargon dictionary shipped with the plugin; add
      your own groups in {{setting:smart_search_extra_synonyms}}. Everything
      runs in-process — no external services, no API keys — and any failure
      falls back to ordinary Discourse search.

    smart_search_minimum_results: Synonym variants only run when the user's
      original search returned fewer than this many posts. Higher values
      expand more often — better recall, more database queries per search.
      Set to 1 to expand only when the original search found nothing. Values
      above your "search page size" setting mean every search expands.

    smart_search_variant_limit: How many synonym-substituted searches may run
      in addition to the user's original one. Each is one extra database
      query. 2 runs both variants that can be built (every word swapped for
      its top synonym, and only the first word swapped); 1 runs only the
      every-word-swapped variant.

    smart_search_extra_synonyms: Site-specific synonym groups added on top of
      the dictionary shipped with the plugin. One group per entry, lowercase,
      words separated by commas — for example "sib,self-injury,self injury".
      Every word in a group is treated as a synonym of every other word in
      it. Takes effect immediately; the shipped dictionary is left untouched.

    # ── Jtech — Desktop pop-ups ────────────────────────────────────────────
    popup_notifications_enabled: Show a small pop-up card in the top-right
      corner when a notification arrives. Desktop browsers only — it never
      renders on mobile. Purely additive — the bell counter, the
      notifications dropdown and read state are untouched. Each user must
      also switch it on under Preferences → Account; turning this off hides
      that preference. Browser tabs that are already open pick the change up
      on their next page load.

    popup_notifications_default_enabled: What "Desktop Pop Up Notifications"
      starts out as for users who have never touched it on their account
      page. Leave this off so switching the feature on does not start popping
      cards up for the entire forum at once. Users who have already made a
      choice keep it either way.

    popup_notifications_timeout_seconds: How long a card stays on screen
      before it disappears on its own. Clicking a card opens the notification
      it came from; clicking anywhere else on the page dismisses every card
      at once.

    popup_notifications_max_stack: How many cards may be stacked at once. The
      newest sits at the top, just below the header; when the stack is full a
      new notification pushes the oldest card off the bottom.

    popup_notifications_excluded_types: Notification kinds to leave out of the
      pop-ups — likes, for example, are usually the noisiest. Excluded kinds
      still appear in the bell and the notifications dropdown as normal.
      Leave empty to pop up for every kind of notification.

    # ── Jtech — Dumbcourse ─────────────────────────────────────────────────
    dumbcourse_enabled: Serve the Dumbcourse single-page app at the base path
      below. When off, every URL under that path returns 404.

    dumbcourse_base_path: First URL segment the app is served from, without
      slashes — "dumb" serves it at /dumb. Must be a single path segment and
      must not collide with a Discourse route such as admin, t or u; core
      routes always win, so a colliding value makes the app unreachable.
      Takes effect immediately, no restart required.

    dumbcourse_default_theme: Colour scheme applied the first time someone
      opens the app. Each visitor can switch afterwards and their choice is
      remembered in that browser, so changing this only affects new visitors.

    dumbcourse_default_view: Topic list shown when someone opens the app at
      its root URL. "My posts" falls back to Latest for signed-out visitors.

    dumbcourse_show_category_names: Show each topic's category name on the
      topic list rows.

    dumbcourse_topic_posters_visibility: Which devices show the latest-poster
      avatars on topic list rows. The app treats a viewport narrower than the
      mobile breakpoint as mobile.

    dumbcourse_online_glow_enabled: Draw a glow ring around the avatars of
      users who are currently online.

    dumbcourse_sidebar_link_enabled: Add a Dumbcourse link to the sidebar of
      the main Discourse forum, pointing at the base path above. This does
      not affect the app itself.

    dumbcourse_pagination_enabled: Use Prev/Next page buttons on topic lists
      instead of infinite scroll.

    dumbcourse_topics_per_page: Topics fetched per page. Has no effect unless
      pagination is enabled — with infinite scroll the app uses Discourse's
      own page size. Discourse rejects values above 100.

    dumbcourse_push_enabled: Allow devices to register for push notifications
      and publish each new notification to Redis. This only reaches users
      running the native Dumbcourse wrapper app — the browser app has no
      service worker, so a separate listener must subscribe to the
      dumbcourse_push Redis channels to actually deliver anything.

    dumbcourse_languagetool_enabled: Add a Refine button to the Dumbcourse
      app's reply, edit, new-topic and new-message composers. It sends the
      draft to LanguageTool and immediately applies the first suggested
      replacement for every match — there is no review step and no undo, so
      the draft is rewritten in place. Does not affect the main Discourse
      composer.

    dumbcourse_languagetool_mode: Which LanguageTool backend to use.
      Self-hosted uses the server URL and secret settings; the cloud API uses
      the endpoint, username and API key settings.

    dumbcourse_languagetool_url: 'Self-hosted mode only. Address of your
      LanguageTool server, e.g. https://lt.example.com. The /v2/check suffix
      is appended for you if you leave it off. Always include https:// — a
      bare host would send the secret below in cleartext.'

    dumbcourse_languagetool_secret: 'Self-hosted mode only, optional. Sent as
      "Authorization: Bearer <value>". To send a different header instead,
      enter it as "Header-Name: value" — everything before the first colon
      becomes the header name.'

    dumbcourse_languagetool_api_url: Cloud API mode only. LanguageTool cloud
      endpoint. Leave at the default unless LanguageTool has given you a
      dedicated endpoint.

    dumbcourse_languagetool_api_username: Cloud API mode only, optional. The
      account e-mail for a LanguageTool Premium plan. Leave blank to use the
      free tier. If you set this you must also set the API key, or every
      Refine request is rejected.

    dumbcourse_languagetool_api_key: Cloud API mode only. The API key paired
      with the username above. Setting a key without a username makes
      LanguageTool reject the request.

    # ── Jtech — Disteleplus ────────────────────────────────────────────────
    disteleplus_enabled: Two-way bridge between one Telegram group and one
      Discourse chat channel. Everything below is inactive until this is on.
      Requires the Chat plugin.

    disteleplus_bot_token: Token from @BotFather (/newbot). The bot must be a
      member of the bridged group, be a group admin, and have privacy mode
      disabled (/setprivacy in @BotFather) — otherwise Telegram never shows
      it other people's group messages and nothing arrives.

    disteleplus_telegram_chat_id: The bridged group's numeric chat ID — a
      negative number such as -1001234567890. Add the bot to the group, then
      read the ID from @RawDataBot or from getUpdates. Messages from any
      other group are ignored and logged to /logs.

    disteleplus_webhook_secret: Shared secret that Telegram sends back in the
      X-Telegram-Bot-Api-Secret-Token header; it is the only thing
      authenticating the inbound webhook. Leave this blank and it is
      generated for you the first time you use
      {{setting:disteleplus_register_webhook_now}}. If you change it by hand,
      run that button again — until you do, every inbound message is
      rejected.

    disteleplus_chat_channel_id: The bridged chat channel's numeric ID — the
      last part of its URL, /chat/c/channel-name/<id>. Only messages in this
      one channel are bridged.

    disteleplus_bridge_bot_username: The Discourse account that posts Telegram
      messages from senders who are not mapped to a Discourse user. If no
      account with this username exists it is created automatically, at trust
      level 4, the first time it is needed. Point it at an existing account
      to reuse one.

    disteleplus_user_map: Telegram accounts that post into chat as a specific
      Discourse user. Without a mapping, a Telegram sender is matched only
      when their Telegram username is identical to a Discourse username; a
      mapping here overrides that. Everyone else posts through the bridge bot
      with their Telegram name as a prefix. Security note — anyone who
      controls a mapped Telegram account can post as that Discourse user, so
      only map people you trust.

    disteleplus_user_mappings: 'Legacy pipe-delimited mappings, replaced by
      the table editor in {{setting:disteleplus_user_map}}. Existing values
      were migrated automatically; this setting is no longer read.'

    disteleplus_bridge_uploads: Copy photos, documents, video and audio across
      the bridge, in both directions, up to the size limit below. When off,
      media is replaced by a short placeholder line.

    disteleplus_max_upload_mb: Files above this size are not copied — a
      Telegram file becomes a placeholder line in chat, and a Discourse
      upload becomes a link to the forum (which needs a login if secure
      uploads are on). 20 MB is the hard ceiling; the Telegram Bot API
      refuses to hand bots anything larger.

    disteleplus_bridge_edits: Editing a message updates the copy on the other
      side. One exception, a Telegram limitation rather than a setting —
      editing a Telegram-originated message inside Discourse changes only the
      Discourse copy, because a bot cannot edit somebody else's Telegram
      message.

    disteleplus_bridge_deletes: Deleting a bridged chat message also deletes
      it in Telegram. The bot needs delete permission in the group, and
      Telegram only allows a bot to delete messages under 48 hours old;
      failures are logged to /logs. Deletions made in Telegram are never
      reported to bots at all, so they can never be mirrored back.

    disteleplus_bridge_polls: Bridge Telegram polls into chat as a text
      snapshot of the question and options, rewritten as votes come in so the
      counts stay roughly current. Voting from Discourse is not possible.

    disteleplus_bridge_reactions: Telegram reactions appear as chat
      reactions — from the matching Discourse user when there is one, from
      the bridge bot otherwise. Reactions sent under a group's anonymous
      identity are skipped. In the other direction Telegram allows a bot
      exactly one reaction per message, so all Discourse reactions on a
      message collapse into the most recent one.

    disteleplus_lock_chat_ui: Turns chat into this one conversation — the chat
      button opens the bridge channel directly, chat hub pages redirect to
      it, and creating channels or direct messages is both hidden and refused
      by the server. Set {{setting:disteleplus_chat_channel_id}} first —
      creating channels and DMs is blocked as soon as this is on, but the
      redirect to the bridge channel only works once the channel ID is set.

    disteleplus_lock_chat_exempt_admins: Admins keep the full chat interface
      while the lock is active — browsing, DMs and channel creation stay
      available to them. The chat button still opens the bridge conversation
      directly, for admins too. Applies to admins only; moderators are locked
      like everyone else.

    disteleplus_register_webhook_now: Tells Telegram where to deliver this
      group's messages. Turn on and save; it generates the webhook secret if
      it is still blank, calls setWebhook, then switches itself back off (the
      checkbox stays ticked until you reload the page). There is no success
      message — check /logs for "setWebhook OK". Run this after first setup,
      after changing the bot token or webhook secret, and after changing the
      forum's domain.

