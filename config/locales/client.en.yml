          jtech_popup_notifications: Jtech — Desktop pop-ups
          jtech_mod_whispers: "Jtech — Mod: Whispers"
          jtech_mod_notes: "Jtech — Mod: Notes"
          jtech_mod_notifications: "Jtech — Mod: Notifications"
          jtech_mod_topic_tools: "Jtech — Mod: Topic tools"
          jtech_mod_checklists: "Jtech — Mod: Checklists"
          jtech_username_avatar: Jtech — Username avatar
          jtech_reqpm: Jtech — REQ-PM
        # Dropdown labels for the plugin's translatable enum settings.
