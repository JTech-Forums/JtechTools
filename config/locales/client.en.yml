  admin_js:
    admin:
      jtech_tools:
        actions:
          title: Maintenance actions
          hint: These run immediately as background jobs. Progress and results
            appear in /logs under the [jtech-tools] tags; delivery failures
            also surface on the admin dashboard.
          register_webhook:
            label: Register Telegram webhook
            confirm: This calls Telegram's setWebhook with this forum's webhook
              address (generating the secret first if blank) and refreshes the
              /disteleplus_* command menu. Register now?
            done: Webhook registration queued.
          send_test_message:
            label: Send test message
            done: Test message queued — check the bridged Telegram group.
          sync_notifications:
            label: Sync channel notifications
            done: Notification enrolment queued for every eligible member.
          measure_forum_uploads:
            label: Measure upload archive
            confirm: This scans every eligible post for attachments and writes
              the totals to /logs. It sends nothing to Telegram. Run the
              measurement now?
            done: Measurement queued — results land in /logs.
          backfill_forum_uploads:
            label: Start upload backfill
            confirm: This starts (or restarts from the beginning) copying
              historical forum attachments into the Telegram upload topic,
              paced by the backfill settings. Start now?
            done: Backfill queued.
          purge_phantom_likes:
            label: Purge phantom likes
            confirm: This rewrites likes_given and likes_received for every
              user who has liked in a restricted category, and deletes their
              like history rows. It cannot be undone. Run the purge now?
            done: Purge queued.
      site_settings:
        categories:
          jtech: Jtech
          jtech_tools: Jtech Tools
          jtech_dislike: Jtech — Dislike
          jtech_smtp: Jtech — Alternate SMTP
          jtech_mini_mod: Jtech — Mini-mod
          jtech_mod: Jtech — Mod
          jtech_dumbcourse: Jtech — Dumbcourse
          jtech_disteleplus: Jtech — Disteleplus
          jtech_translator: Jtech — Translator tweaks
          jtech_smart_search: Jtech — Smart search
          jtech_popup_notifications: Jtech — Desktop pop-ups
          jtech_mod_whispers: "Jtech — Mod: Whispers"
          jtech_mod_notes: "Jtech — Mod: Notes"
          jtech_mod_notifications: "Jtech — Mod: Notifications"
          jtech_mod_topic_tools: "Jtech — Mod: Topic tools"
          jtech_mod_checklists: "Jtech — Mod: Checklists"
        # Dropdown labels for the plugin's translatable enum settings.
        dumbcourse:
          view:
            latest: Latest
            new: New
            top: Top
            unseen: Unseen
            hot: Hot
            my: My posts
            categories: Categories
          posters:
            all: All devices
            desktop: Desktop only
            mobile: Mobile only
            none: "Off"
          languagetool_mode:
            self_hosted: Self-hosted server
            official_api: LanguageTool cloud API
        requires_confirmation_messages:
          purge_phantom_likes_now:
            prompt: This rewrites likes_given and likes_received for every
              user who has liked in a restricted category, and deletes their
              like history rows. It cannot be undone. Run the purge now?
            confirm: Run purge
          discourse_another_email_enabled:
            prompt: This reroutes every outgoing forum email — including group
              SMTP mail — through the relay configured on this tab. Enable
              the alternate relay?
            confirm: Enable relay
          disteleplus_register_webhook_now:
            prompt: This calls Telegram's setWebhook with this forum's webhook
              address (generating the secret first if blank). Register the
              webhook now?
            confirm: Register webhook
          translator_tweaks_worker_url:
            prompt: The translation endpoints are swapped at boot, so this
              change only takes effect after a full app restart. Save it
              anyway?
            confirm: Save (restart required)
