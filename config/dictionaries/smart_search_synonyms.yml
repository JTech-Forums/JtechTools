# --- File formats ---
- [markdown, md]
- [yaml, yml]
- [jsonl, ndjson]

# --- Tech senses of words WordNet gets wrong ---
# WordNet mixes every sense (bug→badger, setup→apparatus), so these override
# it with what a tech-forum user means.
- [bug, defect, glitch]
- [crash, freeze, hang]
- [setup, configuration, installation]
- [config, configuration, settings]
- [slow, laggy, sluggish]

# --- Forum shorthand ---
- [pm, dm, "private-message", "direct-message"]
- [foss, opensource]
- [tldr, "too-long-didnt-read"]
