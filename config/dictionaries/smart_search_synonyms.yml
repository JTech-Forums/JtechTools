# Smart-search tech-jargon overlay.
#
# Only entries WordNet doesn't know go here: abbreviations, product names,
# protocol initialisms and forum shorthand. General English is handled by
# WordNet.
#
# Editing notes:
#   * Lowercase ASCII; lookups are downcased.
#   * Every word in a row is a synonym of every other word in that row, and
#     a search for one may be retried with the FIRST other word of its row,
#     so put the clearest term first.
#   * Real synonyms only — "ubuntu" is not "debian", "npm" is not "pnpm".
#   * No everyday English words (go, do, next, rest, shell, idea, member…):
#     every search containing one would be retried as jargon.
#   * Check with `DiscourseSmartSearch::Synonyms.for("word")` in a Rails
#     console after a restart.

# --- Languages ---
- [javascript, js]
- [typescript, ts]
- [python, py, python3]
- [cplusplus, cpp, "c++"]
- [csharp, "c#"]
- [golang, "go-lang"]
- [kotlin, kt]
- [powershell, pwsh]
- [nodejs, node.js]

