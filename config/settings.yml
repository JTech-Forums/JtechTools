# Jtech — combined plugin settings.
#
# Each top-level key (jtech, jtech_dislike, jtech_smtp, jtech_mini_mod,
# jtech_mod, jtech_dumbcourse) becomes its own admin-UI settings tab.
# Within each tab, settings are ordered: master enable first, then feature
# toggles, then config options for those features. trust_level_4 is the
# Discourse core category.

# ───────────────────────────────────────────────────────────────────────────
# Jtech (master)
# ───────────────────────────────────────────────────────────────────────────
jtech:
  jtech_enabled:
    default: true
    client: true

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Dislike (phantom reactions in restricted categories)
# ───────────────────────────────────────────────────────────────────────────
jtech_dislike:
  # Master switch.
  discourse_no_likes_enabled:
    default: true
    client: false

  # Scope — which categories trigger phantom-reaction behavior.
  no_reactions_category_ids:
    default: ''
    client: false
    type: category_list

  # Audience — who can react inside restricted categories.
  dislike_hide_like_button:
    default: false
    client: false
  dislike_allowed_like_groups:
    default: ''
    client: false
    type: group_list
    allow_any: true

  # What "phantom" actually means — pick any combination.
  dislike_show_in_history:
    default: false
    client: false
  dislike_count_in_leaderboard:
    default: false
    client: false
  dislike_record_audit_trail:
    default: true
    client: false

  # How far back the "liked" notification cleanup looks — under Sidekiq
  # backlog the old hard-coded 30s window could miss and leave the
  # notification standing.
  dislike_notification_cleanup_window_seconds:
    default: 30
    client: false
    min: 5
    max: 600

  # Maintenance — toggle on to retroactively clear; auto-resets after run.
  purge_phantom_likes_now:
    default: false
    client: false
    type: bool

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Alternate SMTP
# ───────────────────────────────────────────────────────────────────────────
jtech_smtp:
  # Master switch.
  discourse_another_email_enabled:
    default: false
    client: false

  # SMTP credentials & endpoint.
  discourse_another_email_smtp_address:
    default: 172.17.0.1
    client: false
  discourse_another_email_smtp_port:
    default: 587
    client: false
    min: 0
    max: 65537
  discourse_another_email_smtp_authentication_mode:
    default: plain
    client: false
  discourse_another_email_smtp_username:
    default: username@example.com
    client: false
  discourse_another_email_smtp_password:
    default: password
    client: false
    secret: true

  # From-address rewriting (optional).
  discourse_another_email_force_from_domain:
    default: ''
    client: false
  discourse_another_email_force_smtp_username_to_sender:
    default: false
    client: false

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Mini-mod (category group moderators get category-create rights)
# ───────────────────────────────────────────────────────────────────────────
jtech_mini_mod:
  # Master switch.
  mini_mod_enabled:
    default: false
    client: true

  # What category group moderators are allowed to do — one toggle per grant.
  mini_mod_can_create_categories:
    default: true
    client: false
  mini_mod_can_edit_categories:
    default: true
    client: false
  mini_mod_can_edit_topics:
    default: true
    client: false
  mini_mod_can_move_topics:
    default: true
    client: false
  mini_mod_manage_all_categories:
    default: false
    client: true
  mini_mod_manage_tags:
    default: false
    client: true
  mini_mod_can_post_in_closed_topics:
    default: false
    client: false
  mini_mod_can_reopen_topics:
    default: false
    client: false
  mini_mod_preload_admin_bundle:
    default: true
    client: false

# ───────────────────────────────────────────────────────────────────────────
# Trust Level 4 (Discourse core category — kept here because mini-mod adds
# settings to it.)
# ───────────────────────────────────────────────────────────────────────────
trust_level_4:
  tl4_can_post_in_closed_topics:
    default: false
    client: false
  tl4_can_reopen_topics:
    default: false
    client: false

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Mod (master switch + the moderator category powers)
# Every moderator grant in this module has its own toggle, split across the
# jtech_mod_* subtabs below, so an admin can see and revoke each one.
# ───────────────────────────────────────────────────────────────────────────
jtech_mod:
  # Master switch for the whole module (except whispers, which have their
  # own independent master on the Whispers subtab).
  mod_categories_enabled:
    default: false
    client: true

  # Moderator category powers (any moderator, site-wide).
  mod_moderators_can_create_categories:
    default: true
    client: false
  mod_moderators_can_edit_categories:
    default: true
    client: false
  mod_moderators_can_delete_categories:
    default: true
    client: false

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Mod: Whispers
# ───────────────────────────────────────────────────────────────────────────
jtech_mod_whispers:
  mod_whisper_enabled:
    default: true
    client: true
  mod_whisper_add_participant_enabled:
    default: true
    client: true
  mod_whisper_convert_enabled:
    default: true
    client: true
  mod_whisper_badge_targeting_enabled:
    default: true
    client: true

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Mod: Notes (private staff notes on topics)
# ───────────────────────────────────────────────────────────────────────────
jtech_mod_notes:
  mod_topic_private_notes_enabled:
    default: true
    client: true
  # Off by default: previously any moderator could silently rewrite or
  # delete another staff member's note or reply. Authors and admins always
  # can; this opts other moderators in.
  mod_moderators_can_edit_others_notes:
    default: false
    client: false
  mod_note_view_tracking_enabled:
    default: true
    client: true
  mod_notes_feed_enabled:
    default: true
    client: true
  mod_notify_staff_on_topic_notes:
    default: true
    client: false

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Mod: Staff notifications
# ───────────────────────────────────────────────────────────────────────────
jtech_mod_notifications:
  mod_notify_staff_on_post_actions:
    default: true
    client: false
  mod_notify_staff_on_post_approved:
    default: false
    client: false
  mod_notify_staff_on_user_notes:
    default: true
    client: false
  mod_notify_staff_on_flag_notes:
    default: true
    client: false
  mod_auto_mark_notifications_seen:
    default: true
    client: true
  mod_notification_type_filter_enabled:
    default: true
    client: true

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Mod: Topic tools
# ───────────────────────────────────────────────────────────────────────────
jtech_mod_topic_tools:
  precheck_new_topic_enabled:
    default: true
    client: true
  topic_footer_message_enabled:
    default: true
    client: true
  topic_reply_prompt_enabled:
    default: true
    client: true
  mod_pin_post_enabled:
    default: true
    client: true
  mod_topic_require_reply_approval_enabled:
    default: true
    client: true
  mod_pm_badge_group_enabled:
    default: true
    client: true

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Mod: Checklists
# ───────────────────────────────────────────────────────────────────────────
jtech_mod_checklists:
  mod_first_post_checklist_enabled:
    default: true
    client: true
  mod_targeted_checklists_enabled:
    default: true
    client: false
  mod_topic_prompt_checklist_enabled:
    default: true
    client: true

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Smart search (synonym query expansion)
# ───────────────────────────────────────────────────────────────────────────
jtech_smart_search:
  smart_search_enabled:
    default: false
    client: false
  smart_search_minimum_results:
    default: 5
    client: false
    min: 0
    max: 50
  smart_search_variant_limit:
    default: 2
    client: false
    min: 1
    max: 5

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Desktop pop-up notifications (Jelly-style toast, desktop only)
# ───────────────────────────────────────────────────────────────────────────
jtech_popup_notifications:
  # Master switch. When off, no toast fires for anyone and the per-user
  # preference on the account page is hidden.
  popup_notifications_enabled:
    default: true
    client: true
  # Default for users who have never set the per-user preference. Off by
  # design — the toast only appears for users who opt in on their account
  # page, so enabling the plugin never surprises the whole forum.
  popup_notifications_default_enabled:
    default: false
    client: true
  # Seconds the toast stays on screen before auto-dismissing.
  popup_notifications_max_stack:
    default: 3
    client: true
    min: 1
    max: 10
  popup_notifications_timeout_seconds:
    default: 20
    client: true
    min: 3
    max: 300

# ───────────────────────────────────────────────────────────────────────────
# Jtech — Dumbcourse (lightweight SPA at /dumb with push notifications)
# ───────────────────────────────────────────────────────────────────────────
jtech_dumbcourse:
  # Master switch.
  dumbcourse_enabled:
    default: true
    client: true

  # Where the SPA mounts and how it looks by default.
  dumbcourse_base_path:
    default: dumb
    client: true
  dumbcourse_default_theme:
    default: dark
    client: true
    type: enum
    choices:
    - dark
    - light
  dumbcourse_default_view:
    default: latest
    client: true
    type: enum
    choices:
    - latest
    - new
    - top
    - unseen
    - hot
    - my
    - categories

  # Display options.
  dumbcourse_sidebar_link_enabled:
    default: true
    client: true
  dumbcourse_show_category_names:
    default: true
    client: true
  dumbcourse_topic_posters_visibility:
    default: all
    client: true
    type: enum
    choices:
    - all
    - desktop
    - mobile
    - none
  dumbcourse_online_glow_enabled:
    default: true
    client: true

  # Topic-list pagination.
  dumbcourse_pagination_enabled:
    default: false
    client: true
  dumbcourse_topics_per_page:
    default: 30
    min: 10
    max: 100
    client: true

  # Push notifications (web push + ntfy SSE).
  dumbcourse_push_enabled:
    default: false
    client: false

  # LanguageTool integration (composer Refine button).
  dumbcourse_languagetool_enabled:
    default: false
    client: false
  dumbcourse_languagetool_mode:
    default: self_hosted
    client: false
    type: enum
    enum: DumbcourseLanguagetoolModeSiteSetting
  dumbcourse_languagetool_url:
    default: ''
    client: false
  dumbcourse_languagetool_secret:
    default: ''
    client: false
  dumbcourse_languagetool_api_url:
    default: https://api.languagetool.org/v2/check
    client: false
  dumbcourse_languagetool_api_username:
    default: ''
    client: false
  dumbcourse_languagetool_api_key:
    default: ''
    client: false

# ─────────────────────────────────────────────────────────────────────────────
# Jtech — Disteleplus (Telegram ⇄ Discourse Chat bridge)
# ─────────────────────────────────────────────────────────────────────────────
jtech_disteleplus:
  # Master switch for the bridge module.
  disteleplus_enabled:
    default: false
    client: true

  # Telegram side. The bot token comes from @BotFather; the webhook secret is
  # auto-generated by the "register webhook" button when left blank; the chat
  # id is the bridged group's id (negative for groups/supergroups).
  disteleplus_bot_token:
    default: ''
    client: false
    secret: true
  disteleplus_webhook_secret:
    default: ''
    client: false
    secret: true
  disteleplus_telegram_chat_id:
    default: ''
    client: false

  # Discourse side. Channel id is the number in the channel URL
  # (/chat/c/-/<id>). The bridge bot posts unmatched Telegram messages and is
  # lazily created at TL4 if the username doesn't exist yet.
  disteleplus_chat_channel_id:
    default: 0
    client: true
    min: 0
    max: 10000000
  disteleplus_bridge_bot_username:
    default: telegram_bridge
    client: false

  # Manual "telegram_username:discourse_username" pairs; takes precedence
  # over the automatic same-username match.
  disteleplus_user_mappings:
    default: ''
    client: false
    type: list
    list_type: compact

  # Feature toggles.
  disteleplus_bridge_uploads:
    default: true
    client: false
  disteleplus_max_upload_mb:
    default: 10
    client: false
    min: 1
    max: 20
  disteleplus_bridge_edits:
    default: true
    client: false
  disteleplus_bridge_deletes:
    default: true
    client: false
  disteleplus_bridge_polls:
    default: true
    client: false
  disteleplus_bridge_reactions:
    default: true
    client: false

  # Chat UI lock — the chat button lands on the bridge channel and creating
  # channels/DMs is hidden (client) and blocked (Guardian).
  disteleplus_lock_chat_ui:
    default: false
    client: true
  disteleplus_lock_chat_exempt_admins:
    default: true
    client: true

  # Maintenance — flip on to (re)register the Telegram webhook; enqueues
  # setWebhook and resets itself (purge_phantom_likes_now precedent).
  disteleplus_register_webhook_now:
    default: false
    client: false
    type: bool
