# Keeps the CURRENT Discourse release's d-compat branch in lockstep with main.
#
# Why: stable-channel forums install/update this plugin from
# d-compat/<their core version> when that branch exists — not from main. The
# official create-d-compat-branch workflow (d-compat-branch.yml) cuts each
# branch ONCE when a core release appears and never advances it, which is
# right for plugins tracking bleeding-edge core but wrong here: our main is
# developed for our own stable forum, so without this sync the forum never
# sees another plugin update until the next core release.
#
# This job fast-forwards only the branch for the LATEST core release on every
# push to main. Branches for older releases stay frozen where the nightly job
# cut them — correct pinning for forums that lag behind on core. The push is
# a plain fast-forward (no force): if the branch ever diverged from main the
# push fails loudly instead of overwriting anything.
name: Sync current d-compat branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward the current release's d-compat branch to main
        run: |
          set -euo pipefail
          # Latest Discourse release, from the same tag pattern the official
          # create-d-compat-branch workflow uses (v20*.0 → e.g. v2026.8.0).
          version="$(git ls-remote --tags https://github.com/discourse/discourse 'v20*.0' \
            | grep -v '\^{}' \
            | awk -F/ '{print $NF}' \
            | sed 's/^v//; s/\.0$//' \
            | sort -V | tail -1)"
          if [ -z "$version" ]; then
            echo "Could not determine the current Discourse version; nothing to sync."
            exit 0
          fi
          branch="d-compat/$version"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "Fast-forwarding $branch to main"
            git push origin "main:refs/heads/$branch"
          else
            echo "$branch does not exist yet — the nightly d-compat-branch job owns creation."
          fi
