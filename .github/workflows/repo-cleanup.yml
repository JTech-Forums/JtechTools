# One-shot, manually-triggered cleanup: deletes the retired d-compat/*
# branches (session push credentials cannot delete refs, but the Actions
# token can). Remove this file once the branches are gone.
name: One-shot branch cleanup

on: workflow_dispatch

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete retired d-compat branches
        run: |
          for b in d-compat/2026.6 d-compat/2026.7 d-compat/2026.8; do
            git push origin --delete "$b" && echo "deleted $b" || echo "$b already gone"
          done
