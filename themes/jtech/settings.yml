  default: true
monochrome_heatmap:
  type: bool
  default: true
monochrome_flair:
  type: bool
  default: true
corner_style:
  type: enum
  default: squircle
  choices:
    - squircle
    - sharp
    - soft
    - round
topic_cards:
  type: bool
  default: true
hero_enabled:
  type: bool
  default: true
hero_title:
  type: string
  default: "Welcome to JTech Forums"
hero_subtitle:
  type: string
  default: "The most precise, accurate and up-to-date tech and filtering information for the Jewish community. Join a conversation, and remember to be kind and helpful."
hero_search_placeholder:
  type: string
  default: "Search phones, filters, guides…"
hero_dismissible:
  type: bool
  default: true
hero_links:
  type: objects
  default:
    - title: JTech Homepage
      description: Guides, tools and downloads
      url: https://jtechforums.org/home
      icon: desktop
    - title: Contact us
      description: Reach the JTech team
      url: https://jtechforums.org/home/contact
      icon: address-book
    - title: eGate filter
      description: Set up and manage eGate
      url: https://jtechforums.org/home/egate
      icon: robot
    - title: Dumbcourse
      description: Android on a dumbphone
      url: https://jtechforums.org/dumb
      icon: fab-android
  schema:
    name: link
    identifier: title
    properties:
      title:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 80
      description:
        type: string
        validations:
          max_length: 160
      url:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 2048
      icon:
        type: string
        validations:
          max_length: 100
