  theme_metadata:
    description: "JTech: Vercel-style AMOLED black and pure white, hairline borders, Geist type."
    settings:
      header_home_url: "Where the header's house icon goes (the JTech homepage). Leave blank to hide it."
      overlay_scrollbar: "Thin overlay scrollbar for the page (macOS style) on mouse/trackpad devices, instead of the browser's wide classic one."
      back_to_top: "Floating back-to-top button on long pages (not on topics, which have their own)."
      command_menu: "⌘K / Ctrl+K command menu: jump to pages, categories, topics and people, or run an action."
      card_thumbnails: "Show the topic's first image beside its title on topic cards."
      code_language_labels: "Header showing the language on code blocks whose author named one (```bash)."
      quick_look: "Add a Quick look button to topic cards that previews the first post in a dialog."
      reading_progress: "Thin bar under the header showing how far through a topic you are."
      external_link_icon: "Mark links in posts that go to other sites with a small arrow."
      internal_hosts: "Hosts that count as this forum (no arrow). Matched exactly; the current host always counts."
      category_banners: "Show a header with the category's icon, name, description and counts on category pages."
      tag_banners: "Show a header with the tag's name and description on tag pages."
      footer_enabled: "Show the JTech footer once a page has fully loaded."
      footer_tagline: "Line under the footer logo. Leave blank to hide."
      footer_links: "Footer links. Links sharing a section form one column, in the order sections first appear."
      hero_enabled: "Show the front-page hero (headline, search, quick links) on the homepage, Latest and Categories."
      hero_title: "Hero headline."
      hero_subtitle: "Hero supporting line. Leave blank to hide."
      hero_search_placeholder: "Placeholder text in the hero search box."
      hero_dismissible: "Let people close the hero. It comes back if the headline changes."
      hero_links: "Quick-link cards next to the headline. Icons are Font Awesome names; new icons may need adding to the svg icon subset."
      topic_cards: "Show discovery topic lists (latest, new, top, categories, tags) as cards."
      corner_style: "Corner shape: squircle (smooth superellipse corners), sharp (Vercel), soft, or round (pill buttons)."
      monochrome_categories: "Show category colors in grayscale (badges and sidebar icons)."
      monochrome_letter_avatars: "Render generated letter avatars in grayscale. Uploaded avatars keep their color."
      monochrome_heatmap: "Use weight instead of orange/red for busy view and reply counts."
